# seekrit-proxy configuration — generated by `seekrit proxy init`.
#
# The proxy resolves the secrets its service token grants (SEEKRIT_TOKEN in the
# environment, never in this file), then swaps {{seekrit:NAME}} placeholders in
# outbound requests for the decrypted values before forwarding upstream.
#
# Safe to commit: it contains hostnames, secret *names*, and thumbprints — no
# secret values and no credential. Review it before you rely on it; the
# allowlist below is a security boundary, and a generator does not know your
# threat model.

listen = "127.0.0.1:8080"

[[route]]
prefix = "/openai"
upstream = "https://api.openai.com"
# allow/methods/paths come from published policy in server mode.

[[route]]
prefix = "/github"
upstream = "https://api.github.com"
# allow/methods/paths come from published policy in server mode.

# ---------------------------------------------------------------------------
# Rules come from agent access policy in the dashboard. The bundle is signed
# in a publishing admin's browser, and this proxy refuses any bundle not
# signed by a key whose thumbprint is pinned below. So seekrit can withhold
# your policy (the proxy then fails closed) but cannot widen it.
# ---------------------------------------------------------------------------
[policy]
source = "server"
agent = "nova"
refresh_interval = "10s"

# THE TRUST ANCHOR — the one value that must not come from the API. Confirm
# each thumbprint against the dashboard's trust-anchor panel before relying
# on this file, and pin a second admin's key too: one pinned signer means one
# lost passphrase leaves nobody able to publish.
#   ownkey — your own signing key (derived locally).
signers = ["ownkey"]

# One proxy fronting several agents: the orchestrator mints a ticket per
# agent. Requires SEEKRIT_PROXY_CONTROL_TOKEN in the environment, and that
# token must not be readable by the agents.
[control]
listen = "127.0.0.1:9090"
ttl = "1h"
max_ttl = "12h"

# Honour tasks dispatched through the API (`seekrit agents dispatch`): a run
# presents its skd_… token in the same header a local ticket uses, and this
# proxy asks the API what it authorizes. Opt-in, because it makes authorizing
# a new run depend on reaching seekrit — a refused or unreachable check denies
# the request rather than admitting it.
#
# cache_ttl bounds how long a revoked run keeps working. Short on purpose.
[tasks]
cache_ttl = "30s"

# Report aggregate decisions back, so `seekrit agents review` can compare this
# policy against what the agent actually does. Counts only: hosts, methods,
# secret *names*, and which rule decided — never a request path, never a value.
# Full per-request detail stays in your own OTLP collector.
[activity]
flush_interval = "60s"

# ---------------------------------------------------------------------------
# Point the workload at the proxy (these go in its environment, not here):
#
#   export OPENAI_BASE_URL='http://127.0.0.1:8080/openai/v1'
#   export OPENAI_API_KEY='{{seekrit:OPENAI_API_KEY}}'
#   export GITHUB_API_URL='http://127.0.0.1:8080/github'
#   export GITHUB_TOKEN='{{seekrit:GITHUB_TOKEN}}'
# ---------------------------------------------------------------------------
